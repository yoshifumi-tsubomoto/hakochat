<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
    .top { background: #1f3a5f; color: #fff; padding: 12px 16px; font-size: 18px; font-weight: bold; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 20px; margin: 24px 16px; max-width: 520px; line-height: 1.7; }
    .btn { display: inline-block; background: #1a73e8; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-size: 17px; margin-top: 8px; }
    .ng { color: #d93025; font-weight: bold; }
    .note { color: #667085; font-size: 13px; }
  </style>
</head>
<body>
  <div class="top"><?= appName ?></div>
  <div class="card">
  <? if (error) { ?>
    <p class="ng"><?= error ?></p>
  <? } else { ?>
    <p><b><?= email ?></b> として確認できました。</p>
    <p><a class="btn" href="<?= nextUrl ?>" target="_top"><?= appName ?> へ進む</a></p>
    <p class="note">このブラウザでは、30日間ログインしたままになります。<br>
    画面の上に「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」という帯が出ることがありますが、そのままで大丈夫です（帯の中のリンクは押さないでください）。</p>
  <? } ?>
  </div>
</body>
</html>
