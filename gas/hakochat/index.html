<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --side: #1f3a5f; --side-text: #dfe7f2; --side-active: #2f5a8f;
    --text: #1f2328; --sub: #667085; --line: #e3e6ea; --accent: #1a73e8; --unread: #d93025; --ok: #188038; --ng: #d93025;
    --new-bg: #fff7e6; --pin: #b26a00; --chip: #eef3fb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; display: flex; flex-direction: column; }
  button, select, input, textarea { font: inherit; }
  button { cursor: pointer; }
  .devbar { background: #fff3cd; border-bottom: 1px solid #f0d58a; padding: 6px 16px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .app { display: flex; flex: 1; min-height: 0; }
  /* サイドバー */
  .side { width: 250px; background: var(--side); color: var(--side-text); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
  .side h1 { font-size: 18px; margin: 0; padding: 16px 16px 4px; color: #fff; }
  .me { padding: 0 16px 12px; font-size: 13px; opacity: .85; }
  .side .sec { padding: 12px 16px 4px; font-size: 12px; opacity: .7; }
  .side .item { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; color: var(--side-text); background: none; border: 0; width: 100%; text-align: left; }
  .side .item:hover { background: rgba(255,255,255,.08); }
  .side .item.active { background: var(--side-active); color: #fff; font-weight: bold; }
  .side .item.has-unread { color: #fff; font-weight: bold; }
  .badge { background: var(--unread); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: bold; }
  .tag { font-size: 10px; border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; font-weight: normal; }
  .t-members { background: #5b6b80; color: #fff; }
  .t-public { background: #e8a33d; color: #3a2600; }
  .t-parents { background: #d46a8a; color: #fff; }
  .side .bottom { margin-top: auto; padding: 8px 16px 16px; font-size: 12px; }
  .side .bottom a { color: var(--side-text); }
  /* メイン */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .head { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .head h2 { font-size: 18px; margin: 0; flex: 1; min-width: 120px; }
  .env { font-size: 11px; background: #e8a33d; color: #3a2600; border-radius: 4px; padding: 1px 6px; }
  .menu-btn { display: none; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; }
  .btn { display: inline-block; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 6px 12px; text-decoration: none; }
  .btn.sub { background: #fff; color: var(--accent); }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  .btn.sub.danger { color: var(--ng); border-color: var(--ng); }
  .list { flex: 1; overflow-y: auto; padding: 12px 16px 40px; }
  .note { color: var(--sub); font-size: 13px; margin: 4px 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; max-width: 760px; }
  .ok { color: var(--ok); font-weight: bold; }
  .ng { color: var(--ng); font-weight: bold; }
  /* スレッド */
  .thread { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .thread.pinned { border-color: #f0c36d; }
  .thread.has-new { box-shadow: inset 4px 0 0 var(--unread); }
  .t-top { display: flex; gap: 8px; align-items: center; padding: 8px 14px 0; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
  .chtag { background: var(--chip); color: var(--side); border-radius: 4px; padding: 1px 6px; }
  .pintag { color: var(--pin); font-weight: bold; }
  .post { display: flex; gap: 10px; padding: 8px 14px; }
  .post.new { background: var(--new-bg); }
  .post.reply { padding-left: 34px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: bold; }
  .role { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .time { font-size: 12px; color: var(--sub); margin-left: 6px; }
  .newmark { font-size: 11px; color: #fff; background: var(--unread); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .text { white-space: pre-wrap; word-break: break-word; margin-top: 2px; line-height: 1.6; }
  .text a { color: var(--accent); }
  .acts { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; position: relative; }
  .react { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 1px 9px; font-size: 13px; }
  .react.on { border-color: var(--accent); background: #e8f0fe; }
  .readers { margin-left: auto; font-size: 12px; color: var(--sub); background: none; border: 0; padding: 2px 4px; }
  .readers.clickable { color: var(--accent); text-decoration: underline; }
  /* 読んだ人の一覧：スレッドの枠で切れないよう、浮かせずに、スタンプの行の下に右寄せで出す（人数が多いときは枠の中でスクロール） */
  .pop { flex-basis: 100%; margin: 6px 0 0 auto; max-width: 260px; max-height: 260px; overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 8px 12px; font-size: 13px; }
  .pop b { display: block; margin-bottom: 4px; }
  .fold { margin: 2px 14px 2px 48px; background: none; border: 0; color: var(--accent); font-size: 13px; padding: 4px 0; }
  .replybox { display: flex; gap: 6px; padding: 8px 14px 12px 48px; }
  .replybox textarea { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; resize: none; line-height: 1.5; }
  .replybox .btn { align-self: flex-end; }
  .mini { background: none; border: 0; color: var(--sub); font-size: 12px; padding: 2px 4px; }
  .mini:hover { color: var(--accent); text-decoration: underline; }
  .text.deleted { color: var(--sub); font-style: italic; }
  textarea.edit { width: 100%; min-height: 70px; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; margin-top: 4px; }
  .composer { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .composer textarea { width: 100%; height: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; margin-top: 8px; }
  .composer .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  body.busy, body.busy button { cursor: progress; }
  .sending { font-size: 12px; color: var(--sub); }
  .sending::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* タブ（スレッド／ファイル） */
  .tabs { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 16px; display: flex; gap: 4px; }
  .tabs:empty { display: none; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--sub); }
  .tabs button.on { border-bottom-color: var(--accent); color: var(--text); font-weight: bold; }
  /* 添付 */
  .attach-btn { border: 1px solid var(--line); background: #fff; color: var(--side); border-radius: 6px; padding: 0 10px; align-self: flex-end; height: 32px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; white-space: nowrap; }
  .attach-btn:hover { border-color: var(--accent); color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 0 48px; }
  .composer .chips { padding: 6px 0 0; }
  .chip { background: var(--chip); color: var(--side); border-radius: 14px; padding: 2px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  .chip button { background: none; border: 0; color: var(--sub); padding: 0; font-size: 14px; line-height: 1; }
  .chip.up { opacity: .6; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .file { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--side); text-decoration: none; max-width: 100%; }
  .file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { display: block; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  .thumb img { display: block; max-width: 220px; max-height: 160px; }
  /* ファイルのタブ */
  .crumb { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .fbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  table.ftable { border-collapse: collapse; width: 100%; background: #fff; font-size: 14px; margin-bottom: 14px; }
  table.ftable th, table.ftable td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  table.ftable th { background: #f0f3f7; }
  table.ftable a { color: var(--text); text-decoration: none; }
  table.ftable a:hover { color: var(--accent); text-decoration: underline; }
  h3.fh { font-size: 15px; margin: 14px 0 6px; }
  /* 管理・欠席連絡・検索 */
  .search { border: 1px solid var(--line); border-radius: 18px; padding: 5px 12px; width: 190px; }
  .composer .lbl { width: 5em; color: var(--sub); font-size: 13px; flex-shrink: 0; }
  .composer input:not([type=checkbox]):not([type=radio]), .composer select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .composer input#mfName, .composer input#mfEmail, .composer input#ncName { flex: 1; min-width: 200px; }
  .composer.abs { border-color: #2e7d32; }
  .btn.abs { background: #2e7d32; border-color: #2e7d32; }
  .abs-note { background: #e8f5e9; border-radius: 6px; padding: 8px 10px; color: #1b5e20; }
  .thread.result { cursor: pointer; }
  .thread.result:hover { border-color: var(--accent); }
  .thread.flash { box-shadow: 0 0 0 3px #ffd54f; transition: box-shadow .3s; }
  mark { background: #ffe58f; }
  .abs-memo { flex: 1; min-height: 54px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
  .abs-private { margin-top: 6px; background: #fdf2f5; border: 1px dashed #d46a8a; border-radius: 6px; padding: 4px 10px; font-size: 13px; color: #8a2846; }
  .abs-private span { white-space: pre-wrap; color: var(--text); }
  .role-desc { margin: 0; padding: 6px 10px 6px 26px; background: #f6f8fb; border-radius: 6px; font-size: 13px; color: #444; line-height: 1.7; flex: 1; }
  .t-tools { display: flex; gap: 6px; padding: 0 14px 6px; justify-content: flex-end; }
  .t-tools button { background: none; border: 0; color: var(--sub); font-size: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 14px; display: none; z-index: 20; max-width: 90%; }
  /* スマホ */
  @media (max-width: 760px) {
    .side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
    .side.open { transform: none; box-shadow: 4px 0 16px rgba(0,0,0,.3); }
    .menu-btn { display: inline-block; }
    .list { padding: 10px 8px 40px; }
    .post.reply { padding-left: 14px; }
    .fold { margin-left: 14px; }
    .replybox { padding-left: 14px; }
    .chips { padding-left: 14px; }
    .search { width: 100%; order: 5; }
    table.ftable { font-size: 13px; }
    .thumb img { max-width: 160px; }
  }

  /* =========================================================
     華やかな見た目（2026-11-24）：グラデーションと光
     色は「アプリの表示」で選んだ色（--side・--side-2・--accent・--glow）に合わせて変わる
     ========================================================= */
  :root { --side-2: #2b5cb8; --glow: #5b9dff; }
  body { background: radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--glow) 14%, transparent), transparent 60%), var(--bg); }

  /* 左の一覧：上から下へのグラデーションと、光のにじみ */
  .side {
    background:
      radial-gradient(420px 260px at 0% 0%, color-mix(in srgb, var(--glow) 35%, transparent), transparent 70%),
      radial-gradient(360px 300px at 100% 100%, color-mix(in srgb, var(--glow) 28%, transparent), transparent 70%),
      linear-gradient(170deg, var(--side) 0%, color-mix(in srgb, var(--side) 55%, var(--side-2)) 55%, var(--side-2) 100%);
    box-shadow: 4px 0 24px -12px color-mix(in srgb, var(--side) 80%, transparent);
  }
  .side h1 { text-shadow: 0 0 18px color-mix(in srgb, var(--glow) 70%, transparent); letter-spacing: .02em; }
  .side .item { border-radius: 8px; margin: 1px 8px; width: calc(100% - 16px); padding: 6px 10px; transition: background .15s, box-shadow .15s; }
  .side .item:hover { background: rgba(255, 255, 255, .12); }
  .side .item.active {
    background: linear-gradient(100deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .08));
    box-shadow: inset 3px 0 0 var(--glow), 0 0 18px -4px color-mix(in srgb, var(--glow) 80%, transparent);
    backdrop-filter: blur(4px);
  }
  .side .sec { padding-left: 18px; }
  .badge { background: linear-gradient(120deg, #ff5f6d, #ff2e63); box-shadow: 0 0 10px -1px rgba(255, 46, 99, .8); }

  /* 見出し：うすいガラスと、色の線 */
  .head { position: relative; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); }
  .head::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--glow), transparent); opacity: .7; }
  .head h2 { background: linear-gradient(100deg, var(--text), color-mix(in srgb, var(--accent) 70%, var(--text))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tabs button.on { border-bottom-color: transparent; background: linear-gradient(var(--accent), var(--glow)) bottom / 100% 3px no-repeat; }

  /* ボタン：グラデーションと光 */
  .btn { background: linear-gradient(110deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--glow))); border-color: transparent; box-shadow: 0 4px 14px -6px color-mix(in srgb, var(--accent) 85%, transparent); transition: filter .15s, transform .15s, box-shadow .15s; }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--glow) 90%, transparent); }
  .btn.sub { background: #fff; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: none; }
  .btn.sub:hover { background: color-mix(in srgb, var(--glow) 10%, #fff); }

  /* スレッド：新着は色のにじみ、ピンは金の縁 */
  .thread { box-shadow: 0 1px 2px rgba(16, 24, 40, .04); transition: box-shadow .2s; }
  .thread:hover { box-shadow: 0 10px 28px -18px color-mix(in srgb, var(--accent) 70%, transparent); }
  .thread.has-new { box-shadow: inset 4px 0 0 var(--unread), 0 10px 30px -18px rgba(217, 48, 37, .55); }
  .newmark { background: linear-gradient(120deg, #ff5f6d, #ff2e63); box-shadow: 0 0 8px -1px rgba(255, 46, 99, .7); }
  .chtag { background: color-mix(in srgb, var(--glow) 16%, #fff); color: color-mix(in srgb, var(--side) 70%, var(--accent)); }
  .react.on { border-color: var(--accent); background: color-mix(in srgb, var(--glow) 18%, #fff); box-shadow: 0 0 10px -4px var(--glow); }
  .composer { border: 2px solid transparent; background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(120deg, var(--accent), var(--glow)) border-box; box-shadow: 0 12px 30px -20px color-mix(in srgb, var(--accent) 80%, transparent); }
  .toast { background: linear-gradient(120deg, #1f2937, color-mix(in srgb, var(--side) 70%, #1f2937)); box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--glow) 80%, transparent); }

  /* ほかのアプリへのリンク（見出しの右上） */
  .app-links { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .app-links:empty { display: none; }
  .app-links a { font-size: 13px; text-decoration: none; color: var(--accent); background: color-mix(in srgb, var(--glow) 12%, #fff); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 99px; padding: 3px 12px; white-space: nowrap; transition: box-shadow .15s, transform .15s; }
  .app-links a:hover { box-shadow: 0 0 12px -2px var(--glow); transform: translateY(-1px); }
  body.plain .app-links a { background: #fff; }
  body.plain .app-links a:hover { box-shadow: none; transform: none; background: #f1f5fb; }

  /* 落ち着いた見た目（「青（落ち着いた）」「アンバー（落ち着いた）」）：グラデーションと光をおさえ、これまでどおりの見た目にする */
  body.plain { background: var(--bg); }
  body.plain .side { background: var(--side); box-shadow: none; }
  body.plain .side h1 { text-shadow: none; }
  body.plain .side .item.active { background: var(--side-active); box-shadow: none; backdrop-filter: none; }
  body.plain .badge, body.plain .newmark { background: var(--unread); box-shadow: none; }
  body.plain .head { background: var(--panel); backdrop-filter: none; }
  body.plain .head::after { display: none; }
  body.plain .head h2 { background: none; color: var(--text); }
  body.plain .tabs button.on { background: none; border-bottom-color: var(--accent); }
  body.plain .btn { background: var(--accent); border-color: var(--accent); box-shadow: none; }
  body.plain .btn:hover { filter: none; transform: none; box-shadow: none; }
  body.plain .btn.sub { background: #fff; color: var(--accent); border-color: var(--accent); }
  body.plain .thread:hover { box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
  body.plain .thread.has-new { box-shadow: inset 4px 0 0 var(--unread); }
  body.plain .chtag { background: var(--chip); color: var(--side); }
  body.plain .react.on { background: #e8f0fe; box-shadow: none; }
  body.plain .composer { background: var(--panel); border: 2px solid var(--accent); box-shadow: none; }
  body.plain .toast { background: #323232; box-shadow: none; }

  /* 狭い画面：隠れているサイドバーの影がにじまないように */
  @media (max-width: 760px) {
    .side { box-shadow: none; }
    .side.open { box-shadow: 4px 0 24px -6px color-mix(in srgb, var(--side) 80%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .btn, .thread, .side .item { transition: none; } }
</style>
</head>
<body data-token="<?= urlToken ?>">
  <div id="devbar" class="devbar" style="display:none"></div>
  <div class="app" id="app">
    <nav class="side" id="side"></nav>
    <main class="main">
      <div class="head">
        <button class="menu-btn" onclick="toggleSide()">≡</button>
        <h2 id="title">ハコチャット</h2>
        <span id="envTag"></span>
        <span id="appLinks" class="app-links"></span>
        <input class="search" id="searchBox" placeholder="🔍 検索（Enter）" onkeydown="if(event.key==='Enter')doSearch(this.value)">
        <button class="btn sub small" id="allBtn" style="display:none" onclick="toggleAll()">すべて表示</button>
        <button class="btn small abs" id="absBtn" style="display:none" onclick="openAbsence()">📝 欠席連絡</button>
        <button class="btn small" id="newBtn" style="display:none" onclick="openComposer()">＋ 新しいスレッド</button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="list" id="list"><p class="note">読み込み中…</p></div>
      <input type="file" id="filePicker" multiple style="display:none">
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
  // ===== ログイン情報（学校外の人のトークン）と、開発用の「表示する人」 =====
  const store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  };
  const urlToken = document.body.dataset.token || '';
  if (urlToken) store.set('tsc_token', urlToken);
  const token = urlToken || store.get('tsc_token');
  let asId = store.get('tsc_as');

  // ===== 状態 =====
  // snap：画面を開いた時点の既読日時。折りたたみはこれを基準にする（読んでいる途中で急に閉じないように）
  // openFolds：スレッドごとの開閉（true＝開いている、'closed'＝閉じている、なし＝全体の設定に従う）
  // drafts：書きかけの文（新着の確認で画面を描き直しても消えないように）
  const state = {
    res: null, home: null, view: 'stream', showAll: false, openFolds: {}, snap: {}, pop: null,
    composing: false, editing: null, drafts: {}, busy: false, pendingRender: false,
    tab: 'threads', files: null, attach: {}
  };
  const MAX_FILE_BYTES = 20 * 1024 * 1024;
  // クリップの線画（絵文字の📎はWindowsでは分かりにくい絵になるため）
  const CLIP_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
  const TYPE_TAG = { members: '限定', public: '保護者も', parents: '保護者のみ' };
  const POLL_SEC = 30;
  const READ_DELAY_MS = 1500;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function linkify(s) {
    return esc(s).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; });
  }
  function shortTime(t) { return t ? t.slice(5, 16).replace('-', '/') : ''; }
  function color(id) {
    const c = ['#1f3a5f', '#2e7d32', '#6a1b9a', '#00838f', '#e65100', '#ad1457', '#5d4037', '#283593', '#558b2f'];
    let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return c[h % c.length];
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, 3000);
  }
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
    });
  }
  function showError(e) {
    document.getElementById('list').innerHTML = '<div class="card"><span class="ng">エラー</span>：' + esc(e.message || e) + '</div>';
  }

  /** 書き込みの操作を送る。終わったら画面のデータを入れ替える */
  function act(fn) {
    if (state.busy) return Promise.resolve(false);
    state.busy = true;
    document.body.classList.add('busy');
    const args = [fn, token, asId].concat(Array.prototype.slice.call(arguments, 1));
    // 反応などの記録が残っていれば、それが終わってから送る（戻ってきたデータに反映されるように）
    const waitAll = Promise.all(Object.keys(chains).map(function (k) { return chains[k]; }));
    return waitAll.then(function () { return call.apply(null, args); }).then(function (home) {
      state.home = home;
      return true;
    }).catch(function (e) {
      toast('できませんでした：' + (e.message || e));
      return false;
    }).finally(function () {
      state.busy = false;
      document.body.classList.remove('busy');
    });
  }

  // ===== 読み込み =====
  function init() {
    document.getElementById('list').innerHTML = '<p class="note">読み込み中…</p>';
    call('api_init', token, asId).then(function (res) {
      state.res = res;
      state.home = res.home || null;
      state.ver = res.ver || '';
      state.view = 'stream';
      state.drafts = {};
      takeSnap();
      applyApp(res.app);
      renderAll();
      checkNewVersion();
    }).catch(showError);
  }

  // ===== アプリの表示（名前・色）と版 =====
  function applyApp(app) {
    if (!app) return;
    const c = app.colors.filter(function (x) { return x.id === app.color; })[0] || app.colors[0];
    const st = document.documentElement.style;
    st.setProperty('--side', c.side);
    st.setProperty('--side-2', c.side2 || c.active);
    st.setProperty('--side-active', c.active);
    st.setProperty('--accent', c.accent || '#1a73e8');
    st.setProperty('--glow', c.glow || '#5b9dff');
    // 落ち着いた見た目（グラデーションと光をおさえる）
    document.body.classList.toggle('plain', !!c.plain);
    document.title = app.name;
  }
  /** 新しい版があるか確かめる（管理者だけ。配布用の版だけ。失敗しても何もしない） */
  function checkNewVersion() {
    const app = state.res && state.res.app;
    const me = state.res && state.res.who && state.res.who.member;
    if (!app || !app.versionUrl || !me || !me.isAdmin || !window.fetch) return;
    // version.json の形：{ version, url, history: [{ version, date, notes: [変更点, …] }, …] }
    fetch(app.versionUrl, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
      if (!v || !v.version || !newerVersion(v.version, app.version)) return;
      // 今の版より新しい版の変更点を、新しい順に集める
      v.changes = (v.history || []).filter(function (h) { return h && h.version && newerVersion(h.version, app.version); });
      state.newVersion = v;
      if (state.home) renderSide();
      if (state.view === 'admin') renderAdmin();
    }).catch(function () {});
  }
  /** 新しい版の変更点（管理画面に出す） */
  function newVersionHtml() {
    const v = state.newVersion;
    if (!v) return '';
    let h = '<div class="card" style="border-color:#e8a33d;background:#fffaf0"><b>🆕 新しい版 ' + esc(v.version) + ' があります</b>（今の版：' + esc(state.res.app.version) + '）';
    h += (v.changes || []).map(function (c) {
      return '<div style="margin-top:6px"><b>版 ' + esc(c.version) + '</b>' + (c.date ? '（' + esc(c.date) + '）' : '') +
        '<ul style="margin:2px 0 0;padding-left:1.4em">' + (c.notes || []).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    if (v.url) h += '<p style="margin:8px 0 0"><a class="btn small" href="' + esc(v.url) + '" target="_blank" rel="noopener">更新のしかたを見る</a></p>';
    return h + '</div>';
  }
  function newerVersion(a, b) {
    const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
    return false;
  }
  function refresh() {
    if (!state.home || state.busy || state.pendingOps > 0 || document.visibilityState !== 'visible') return;
    // 前回の版を渡す。だれも書き込んでいなければ「変わっていない」とだけ返ってくるので、何もしない
    call('api_home', token, asId, state.ver).then(function (home) {
      if (home.unchanged || state.pendingOps > 0) return;
      state.home = home; state.ver = home.ver; renderSoon();
    }).catch(function () {});
  }
  setInterval(refresh, POLL_SEC * 1000);

  /** 入力中に描き直すと、入力欄の文字の位置などが失われるので、入力が終わってから描き直す */
  function renderSoon() {
    // 管理画面は入力欄が多いので、新着の確認では左の一覧だけを描き直す
    if (state.view === 'admin') { renderSide(); return; }
    const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.tagName === 'SELECT') && document.getElementById('list').contains(a)) {
      state.pendingRender = true;
      return;
    }
    state.pendingRender = false;
    renderAll();
  }
  // 入力欄から離れても、すぐには描き直さない。
  // ボタンを押したときは「入力欄から離れる」が先に起きるので、すぐ描き直すとボタンが作り直されて、押したことが無視されてしまう。
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (state.pendingRender) renderSoon(); }, 800);
  });

  function takeSnap() {
    state.snap = {}; state.openFolds = {}; state.showAll = false; state.pop = null; state.editing = null;
    if (state.home) state.home.threads.forEach(function (t) { state.snap[t.id] = t.myRead; });
  }

  // ===== 描画 =====
  function renderAll() {
    const res = state.res;
    document.getElementById('envTag').innerHTML = res.env === 'dev' ? '<span class="env">開発版（ダミーデータ）</span>' : '';
    renderDevbar(res);
    if (res.needSetup) { renderSetup(res); return; }
    if (!res.who.member) { renderNoMember(res); return; }
    renderSide();
    renderTabs();
    setHeadButtons();
    if (state.view === 'admin') { renderAdmin(); return; }
    if (state.view === 'search') { renderSearch(); return; }
    if (state.tab === 'files' && state.view !== 'stream') { renderFiles(); return; }
    renderThreads();
    watchUnread();
  }

  /** 見出しの右側のボタン（画面ごとに出すものが違う） */
  function setHeadButtons() {
    const v = state.view, isThreads = v !== 'admin' && v !== 'search' && state.tab !== 'files';
    const ch = v === 'stream' || v === 'admin' || v === 'search' ? null : chById(v);
    const role = state.res.who.member.role;
    const canAbs = ch && ch.purpose === 'absence' && (role === '生徒' || role === '保護者' || state.res.who.member.isAdmin);
    document.getElementById('allBtn').style.display = isThreads ? '' : 'none';
    document.getElementById('newBtn').style.display = isThreads && state.home.channels.length ? '' : 'none';
    document.getElementById('absBtn').style.display = isThreads && canAbs ? '' : 'none';
    document.getElementById('searchBox').style.display = v === 'admin' ? 'none' : '';
    if (!canAbs) state.absence = false;
  }

  function renderTabs() {
    const el = document.getElementById('tabs');
    if (state.view === 'stream') { el.innerHTML = ''; return; }
    el.innerHTML = '<button class="' + (state.tab === 'threads' ? 'on' : '') + '" onclick="setTab(\'threads\')">💬 スレッド</button>' +
      '<button class="' + (state.tab === 'files' ? 'on' : '') + '" onclick="setTab(\'files\')">📁 ファイル</button>';
  }

  function setTab(tab) {
    state.tab = tab;
    state.composing = false;
    if (tab === 'files') { state.files = null; loadFiles(); }
    renderAll();
  }

  function loadFiles() {
    const chId = state.view;
    call('api_files', token, asId, chId).then(function (f) {
      if (state.view !== chId || state.tab !== 'files') return;
      state.files = f;
      renderAll();
    }).catch(function (e) { state.files = { error: e.message || String(e) }; renderAll(); });
  }

  function fileIcon(mime, kind) {
    if (kind === 'folder') return '📁';
    if (/^image\//.test(mime)) return '🖼️';
    if (/pdf/.test(mime)) return '📕';
    if (/spreadsheet|excel|csv/.test(mime)) return '📊';
    if (/presentation|powerpoint/.test(mime)) return '📽️';
    if (/document|word|text/.test(mime)) return '📄';
    if (/^video\//.test(mime)) return '🎬';
    return '📎';
  }

  function renderFiles() {
    const ch = chById(state.view);
    document.getElementById('title').textContent = '# ' + ch.name;
    ['allBtn', 'newBtn'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
    const f = state.files;
    const list = document.getElementById('list');
    if (!f) { list.innerHTML = '<p class="note">フォルダを読み込み中…</p>'; return; }
    if (f.error) { list.innerHTML = '<div class="card"><span class="ng">エラー</span>：' + esc(f.error) + '</div>'; return; }
    const row = function (x) {
      return '<tr><td><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + fileIcon(x.mime, x.kind) + ' ' + esc(x.name) + '</a></td><td>' + shortTime(x.updated) + '</td></tr>';
    };
    let h = '<div class="crumb">' + (f.place === 'admin' ? '先生だけの共有ドライブ' : '活動の共有ドライブ') + ' ／ <b>' + esc(f.folderName) + '</b></div>';
    h += '<div class="fbar"><a class="btn small" href="' + esc(f.folderUrl) + '" target="_blank" rel="noopener">↗ Googleドライブで開く</a>' +
      '<span class="note" style="margin:0">' + (f.canEdit ? '名前の変更・移動・削除は、Googleドライブで直接できます。' : '見ることができます。') + '</span></div>';
    h += '<h3 class="fh">フォルダの中身</h3><table class="ftable"><tr><th>名前</th><th>更新</th></tr>' +
      (f.items.map(row).join('') || '<tr><td colspan="2">まだありません</td></tr>') + '</table>';
    h += '<h3 class="fh">チャットに添付されたファイル（「チャット添付」フォルダ）</h3><table class="ftable"><tr><th>名前</th><th>更新</th></tr>' +
      (f.attached.map(row).join('') || '<tr><td colspan="2">まだありません</td></tr>') + '</table>';
    if (f.permPlan) {
      h += '<h3 class="fh">🔒 このフォルダの共有（管理者だけに表示）</h3><p class="note">' + esc(f.permPlan.note) + '</p>' +
        '<table class="ftable"><tr><th>メンバー</th><th>権限</th><th>状態</th></tr>' +
        (f.permPlan.rows.map(function (r) { return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.role) + '</td><td>' + esc(r.status) + '</td></tr>'; }).join('') ||
          '<tr><td colspan="3">追加する人はいません</td></tr>') + '</table>' +
        '<button class="btn sub small" onclick="applyPerms()">すべてのチャンネルの共有を、予定どおりに設定する</button><div id="permLog" class="note"></div>';
    }
    list.innerHTML = h;
  }

  function applyPerms() {
    document.getElementById('permLog').textContent = '設定しています…';
    call('api_applyPermissions', token, asId).then(function (log) {
      state.files = null; loadFiles();
      toast(log.length ? '共有を設定しました（' + log.length + '件）' : '変更はありませんでした');
    }).catch(function (e) { toast('できませんでした：' + (e.message || e)); });
  }

  /** 本番の最初の準備（アプリの所有者だけに出る） */
  function renderSetup(res) {
    document.getElementById('side').style.display = 'none';
    ['allBtn', 'newBtn', 'absBtn', 'searchBox'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
    const app = res.app;
    document.getElementById('title').textContent = app.name + ' の準備';
    const d = res.defaults;
    const colorOpts = app.colors.map(function (c) {
      return '<label style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><input type="radio" name="spColor" value="' + c.id + '"' + (c.id === app.color ? ' checked' : '') +
        '><span style="display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(160deg,' + c.side + ',' + (c.side2 || c.side) + ');box-shadow:0 0 8px -1px ' + (c.glow || c.side) + '"></span>' + esc(c.name) + '</label>';
    }).join('');
    document.getElementById('list').innerHTML =
      '<div class="composer" style="max-width:760px"><b>はじめての準備（最初に1回だけ）</b>' +
      '<p class="note">' + esc(res.owner) + ' で準備します。このアカウントが、アプリの所有者で最初の管理者になります。</p>' +
      '<div class="row"><span class="lbl">アプリ名</span><input id="spAppName" value="' + esc(app.name) + '" maxlength="30"></div>' +
      '<div class="row"><span class="lbl">団体名</span><input id="spOrg" value="' + esc(app.org || '') + '" maxlength="40" placeholder="例：〇〇中学校 科学部（なくてもよい）" style="flex:1"></div>' +
      '<div class="row"><span class="lbl">色</span><span>' + colorOpts + '</span></div>' +
      '<div class="row"><span class="lbl">活動の<br>共有ドライブ</span><input id="spClub" style="flex:1" value="' + esc(d.club) + '"></div>' +
      '<p class="note" style="margin:2px 0 0 5.5em">チャンネルにするフォルダ（02 実験班 など）が並んでいる共有ドライブ。URLかIDを入れます。メンバーの生徒が使っている共有ドライブです。</p>' +
      '<div class="row"><span class="lbl">先生だけの<br>共有ドライブ</span><input id="spAdmin" style="flex:1" value="' + esc(d.admin) + '"></div>' +
      '<p class="note" style="margin:2px 0 0 5.5em">データのスプレッドシートと、生徒に見せないチャンネルのフォルダを置く、先生だけがメンバーの共有ドライブ。</p>' +
      '<div class="row"><span class="lbl">あなたの<br>表示名</span><input id="spName" value="' + esc(d.ownerName) + '" placeholder="例：山田先生"></div>' +
      '<p class="note">アプリ名・団体名・色は、あとで「⚙ 管理 → 🎨 アプリの表示」で変えられます。</p>' +
      '<div class="row"><span style="flex:1"></span><button class="btn" id="spBtn" onclick="doSetup()">準備する</button></div></div>';
  }
  function doSetup() {
    const btn = document.getElementById('spBtn');
    btn.disabled = true; btn.textContent = '準備しています…';
    const color = document.querySelector('input[name="spColor"]:checked');
    const settings = { name: document.getElementById('spAppName').value, org: document.getElementById('spOrg').value, color: color ? color.value : '' };
    call('api_setupProd', token, asId, document.getElementById('spClub').value, document.getElementById('spAdmin').value, document.getElementById('spName').value, settings)
      .then(function (r) {
        toast('準備しました。フォルダを ' + r.channels + ' 個見つけました。「⚙ 管理 → # チャンネル」で種類を決めてください');
        init();
      })
      .catch(function (e) { btn.disabled = false; btn.textContent = '準備する'; toast('できませんでした：' + (e.message || e)); });
  }

  function renderNoMember(res) {
    document.getElementById('side').style.display = 'none';
    ['allBtn', 'newBtn', 'absBtn', 'searchBox'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
    const w = res.who;
    let h = '<div class="card"><h2 style="font-size:16px;margin:0 0 8px">ようこそ</h2>';
    if (w.email) {
      h += '<p><span class="ng">登録されていません</span></p><p>' + esc(w.email) +
        ' は、まだメンバーとして登録されていません。管理者の先生に、このアドレスを伝えて登録を頼んでください。</p>';
    } else {
      h += '<p><span class="ng">未確認</span>' + (w.error ? '：' + esc(w.error) : '') + '</p>';
      if (res.loginUrl) h += '<p><a class="btn" href="' + esc(res.loginUrl) + '" target="_top">Googleアカウントでログイン（学校外の方）</a></p>';
      else h += '<p class="note">学校外の方のログインは、まだ準備中です。</p>';
    }
    document.getElementById('list').innerHTML = h + '</div>';
  }

  function unreadOf(t) {
    return t.posts.filter(function (p) { return !p.deleted && !p.mine && p.createdAt > t.myRead; }).length;
  }

  function renderSide() {
    const side = document.getElementById('side');
    side.style.display = '';
    const me = state.res.who.member;
    const unreadBy = {};
    state.home.threads.forEach(function (t) { unreadBy[t.channelId] = (unreadBy[t.channelId] || 0) + unreadOf(t); });
    const total = Object.keys(unreadBy).reduce(function (s, k) { return s + unreadBy[k]; }, 0);
    const item = function (id, label, n, extra) {
      return '<button class="item ' + (state.view === id ? 'active ' : '') + (n ? 'has-unread' : '') + '" onclick="go(\'' + id + '\')">' +
        '<span>' + label + (extra || '') + '</span>' + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
    };
    const app = state.res.app || { name: 'ハコチャット', org: '' };
    let h = '<h1>' + esc(app.name) + '</h1>' + (app.org ? '<div class="me" style="padding-bottom:2px">' + esc(app.org) + '</div>' : '') + '<div class="me">' + esc(me.name) + '（' + esc(me.role) + (me.isAdmin && me.role !== '管理者' ? '・管理者' : '') + '）</div>';
    h += item('stream', '🏠 ストリーム', total);
    h += '<div class="sec">チャンネル</div>';
    h += state.home.channels.map(function (c) {
      const tag = TYPE_TAG[c.type] ? '<span class="tag t-' + c.type + '">' + TYPE_TAG[c.type] + '</span>' : '';
      return item(c.id, '# ' + esc(c.name), unreadBy[c.id] || 0, tag);
    }).join('');
    if (!state.home.channels.length) h += '<div class="sec">見られるチャンネルはまだありません</div>';
    h += '<div class="bottom">';
    if (me.isAdmin) h += item('admin', '⚙ 管理', 0);
    else if (me.role === '指導者') h += '<button class="item" onclick="coachNewChannel()">＋ チャンネルを作る</button>';
    if (me.role === '保護者') h += '<button class="item" onclick="openSettings()">👤 設定（メール：' + (me.notify ? '受け取る' : '止めている') + '）</button>';
    h += (state.res.dataUrl ? '<a href="' + esc(state.res.dataUrl) + '" target="_blank" style="display:block;padding:8px 16px 0">データのスプレッドシート</a>' : '');
    // ほかのアプリへのリンク（ハコ日誌など）は、見出しの右上に出す。全員に出す
    document.getElementById('appLinks').innerHTML = ((state.res.app && state.res.app.links) || []).map(function (l) {
      return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">🔗 ' + esc(l.name) + '</a>';
    }).join('');
    if (me.isAdmin && state.res.app) {
      h += '<div style="padding:8px 16px 0;opacity:.75">版 ' + esc(state.res.app.version) + '</div>';
      if (state.newVersion) h += '<button class="item" style="color:#ffe08a;font-weight:bold" onclick="go(\'admin\'); adminSet(\'app\')">🆕 新しい版 ' + esc(state.newVersion.version) + ' があります（変更点を見る）</button>';
    }
    h += '</div>';
    side.innerHTML = h;
  }

  function chById(id) { return state.home.channels.filter(function (c) { return c.id === id; })[0]; }

  function renderThreads() {
    const ch = state.view === 'stream' ? null : chById(state.view);
    if (state.view !== 'stream' && !ch) { state.view = 'stream'; return renderThreads(); }
    document.getElementById('title').textContent = ch ? '# ' + ch.name : '🏠 ストリーム（すべてのチャンネル）';
    document.getElementById('allBtn').textContent = state.showAll ? '既読を折りたたむ' : 'すべて表示';

    let ths = state.home.threads.slice();
    if (ch) ths = ths.filter(function (t) { return t.channelId === ch.id; });
    const rank = function (t) { return t.pinned ? 0 : t.myPin ? 1 : 2; };
    ths.sort(function (a, b) { return rank(a) - rank(b) || (a.updatedAt < b.updatedAt ? 1 : -1); });

    let h = '';
    if (state.absence && ch) h += absenceFormHtml(ch);
    if (state.composing) h += composerHtml(ch);
    h += '<div class="note">📌＝全員へのピン止め、🔖＝自分のピン。その次に、新しい返信があったスレッドが上に来ます。既読の返信は折りたたまれます。</div>';
    h += ths.map(threadHtml).join('') || '<div class="note">スレッドはまだありません。「＋ 新しいスレッド」から書き込めます。</div>';
    document.getElementById('list').innerHTML = h;
  }

  function composerHtml(ch) {
    const opts = state.home.channels.map(function (c) {
      return '<option value="' + c.id + '"' + ((ch ? ch.id : state.drafts._ch) === c.id ? ' selected' : '') + '># ' + esc(c.name) + '</option>';
    }).join('');
    return '<div class="composer"><b>新しいスレッド</b>' +
      '<div class="row"><span>チャンネル：</span><select id="newCh" onchange="changeNewCh(this.value)">' + opts + '</select></div>' +
      '<textarea id="newText" placeholder="本文を入力（Ctrl＋Enterでも投稿できます）" oninput="state.drafts._new=this.value" onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))newThread()">' + esc(state.drafts._new || '') + '</textarea>' +
      chipsHtml('_new') +
      '<div class="row"><button class="attach-btn" title="ファイルを添付" onclick="pickFiles(\'_new\')">' + CLIP_SVG + '<span>ファイルを添付</span></button><span style="flex:1"></span><button class="btn sub small" onclick="state.composing=false; renderThreads()">やめる</button>' +
      '<button class="btn small" onclick="newThread()">投稿する</button></div></div>';
  }

  function threadHtml(t) {
    const ch = chById(t.channelId);
    const read = state.snap[t.id] || '';
    const first = t.posts[0], replies = t.posts.slice(1);
    const wasRead = function (p) { return p.mine || p.deleted || p.createdAt <= read; };
    const readReplies = replies.filter(wasRead);
    const unreadReplies = replies.filter(function (p) { return !wasRead(p); });
    const of = state.openFolds[t.id];
    const canFold = readReplies.length > 0;
    const fold = canFold && (of === 'closed' || (!state.showAll && of !== true));
    const n = unreadOf(t);
    const me = state.res.who.member;

    let h = '<div class="thread ' + (t.pinned ? 'pinned ' : '') + (n ? 'has-new' : '') + '" data-tid="' + t.id + '"' + (n ? ' data-unread="1"' : '') + '>';
    h += '<div class="t-top">' + (state.view === 'stream' ? '<span class="chtag"># ' + esc(ch.name) + '</span>' : '') +
      (t.pinned ? '<span class="pintag">📌 全員にピン止め</span>' : '') +
      (t.myPin ? '<span class="pintag" style="color:var(--accent)">🔖 自分のピン</span>' : '') +
      (n ? '<span style="color:var(--unread)">新着 ' + n + '件</span>' : '') + '</div>';
    h += postHtml(t, first, false);
    if (fold) {
      h += '<button class="fold" onclick="setFold(\'' + t.id + '\', true)">▸ 既読の返信 ' + readReplies.length + '件を表示</button>';
      h += unreadReplies.map(function (p) { return postHtml(t, p, true); }).join('');
    } else {
      if (canFold) h += '<button class="fold" onclick="setFold(\'' + t.id + '\', \'closed\')">▾ 既読の返信を折りたたむ</button>';
      h += replies.map(function (p) { return postHtml(t, p, true); }).join('');
    }
    // 新しいスレッドの記録が終わるまでは、返信やピン止めはできない
    if (t.pending) return h + '</div>';
    h += chipsHtml(t.id);
    h += '<div class="replybox"><textarea rows="1" id="rb-' + t.id + '" placeholder="返信を書く…（Ctrl＋Enterでも送信）" ' +
      'oninput="state.drafts[\'' + t.id + '\']=this.value; grow(this)" onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))reply(\'' + t.id + '\')">' +
      esc(state.drafts[t.id] || '') + '</textarea><button class="attach-btn" title="ファイルを添付" onclick="pickFiles(\'' + t.id + '\')">' + CLIP_SVG + '<span>添付</span></button>' +
      '<button class="btn small" onclick="reply(\'' + t.id + '\')">送信</button></div>';
    h += '<div class="t-tools"><button onclick="toggleMyPin(\'' + t.id + '\')">' + (t.myPin ? '🔖 自分のピンを外す' : '🔖 自分だけピン止め') + '</button>' +
      (me.isAdmin ? '<button onclick="togglePin(\'' + t.id + '\')">' + (t.pinned ? '📌 全員へのピン止めを外す' : '📌 全員にピン止め') + '</button>' : '') + '</div>';
    return h + '</div>';
  }

  function postHtml(t, p, isReply) {
    const me = state.res.who.member;
    const head = function (isNew) {
      return '<div class="avatar" style="background:' + color(p.author.id || p.author.name) + '">' + esc(p.author.name.charAt(0)) + '</div><div class="body">' +
        '<div><span class="name">' + esc(p.author.name) + '</span>' + (p.author.role ? '<span class="role">' + esc(p.author.role) + '</span>' : '') +
        '<span class="time">' + shortTime(p.createdAt) + (p.editedAt ? '（編集済み）' : '') + '</span>' + (isNew ? '<span class="newmark">新着</span>' : '') + '</div>';
    };
    if (p.deleted) {
      return '<div class="post ' + (isReply ? 'reply' : '') + '">' + head(false) + '<div class="text deleted">（この投稿は削除されました）</div></div></div>';
    }
    const isNew = !p.mine && p.createdAt > t.myRead;
    let h = '<div class="post ' + (isReply ? 'reply ' : '') + (isNew ? 'new' : '') + '">' + head(isNew);
    if (state.editing === p.id) {
      h += '<textarea class="edit" id="ed-' + p.id + '" oninput="state.drafts[\'ed-' + p.id + '\']=this.value">' + esc(state.drafts['ed-' + p.id] != null ? state.drafts['ed-' + p.id] : p.body) + '</textarea>' +
        '<div class="acts"><button class="btn small" onclick="saveEdit(\'' + p.id + '\')">保存</button><button class="btn sub small" onclick="cancelEdit()">やめる</button></div>';
      return h + '</div></div>';
    }
    if (p.body) h += '<div class="text">' + linkify(p.body) + '</div>';
    // 先生・指導者へのメモ（サーバーは、先生と指導者にだけ中身を渡している）
    if (p.abs && p.abs.note) h += '<div class="abs-private">🔒 ' + (p.mine ? 'あなたが書いた先生・指導者へのメモ（ほかの方には見えません）' : '先生・指導者だけに表示') + '：<span>' + esc(p.abs.note) + '</span></div>';
    if (p.files && p.files.length) {
      h += '<div class="files">' + p.files.map(function (f) {
        if (/^image\//.test(f.mime)) {
          // 写真は小さな見本を出す（表示できないときは、ふつうのファイルの表示に切り替える）
          return '<a class="thumb" href="' + esc(f.url) + '" target="_blank" rel="noopener" title="' + esc(f.name) + '">' +
            '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(f.id) + '&sz=w440" alt="' + esc(f.name) + '" onerror="thumbFail(this)"></a>';
        }
        return '<a class="file" href="' + esc(f.url) + '" target="_blank" rel="noopener">' + fileIcon(f.mime) + ' <span>' + esc(f.name) + '</span></a>';
      }).join('') + '</div>';
    }
    // 送信中（記録が終わるまで）は、スタンプや編集はまだできない
    if (p.pending) return h + '<div class="acts"><span class="sending">送信中…</span></div></div></div>';
    const react = function (k, icon, label) {
      const r = p.reactions[k];
      return '<button class="react ' + (r.mine ? 'on' : '') + '" title="' + label + '：' + esc(r.names.join('、') || 'まだいません') + '" onclick="react(\'' + p.id + '\', \'' + k + '\')">' + icon + ' ' + (r.n || '') + '</button>';
    };
    h += '<div class="acts">' + react('see', '👀', '見ました') + react('like', '👍', 'いいね') + react('no', '🙅', '反対');
    if (p.mine) h += '<button class="mini" onclick="startEdit(\'' + p.id + '\')">編集</button>';
    if (p.mine || me.isAdmin) h += '<button class="mini" onclick="removePost(\'' + p.id + '\')">削除</button>';
    // 保護者には名前が届かない（GASの通信では「なし」の印が消えることがあるので、名前の一覧があるかどうかで判断する）
    if (!Array.isArray(p.readers.names)) {
      h += '<span class="readers">既読 ' + p.readers.n + '人</span>';
    } else {
      h += '<button class="readers clickable" onclick="togglePop(\'' + p.id + '\', event)">既読 ' + p.readers.n + '人</button>';
      if (state.pop === p.id) h += '<div class="pop"><b>読んだ人（' + p.readers.n + '人）</b>' + (p.readers.names.map(esc).join('<br>') || 'まだいません') + '</div>';
    }
    return h + '</div></div></div>';
  }

  function renderDevbar(res) {
    const bar = document.getElementById('devbar');
    if (!res.devMembers) { bar.style.display = 'none'; return; }
    if (bar.dataset.done) return;
    const opts = ['<option value="">（自分）</option>'].concat(res.devMembers.map(function (m) {
      return '<option value="' + esc(m.id) + '"' + (m.id === asId ? ' selected' : '') + '>' + esc(m.name) + '（' + esc(m.role) + '）</option>';
    })).join('');
    bar.innerHTML = '<b>開発用</b><span>表示する人：</span><select id="asSel">' + opts + '</select><span class="note" style="margin:0">所有者だけに表示されます</span>';
    bar.style.display = 'flex';
    bar.dataset.done = '1';
    document.getElementById('asSel').onchange = function () { asId = this.value; store.set('tsc_as', asId); init(); };
  }

  // ===== 既読：画面に表示されたスレッドを、少し待ってから既読にする =====
  let observer = null, readQueue = {}, readTimer = null;
  function watchUnread() {
    if (observer) observer.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const timers = {};
    // 「よく見えている」＝スレッドの半分以上が見えている、または画面の高さの半分以上をスレッドが占めている
    // （画面より縦に長いスレッドでも、既読になるように）
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        const id = en.target.dataset.tid;
        const viewH = (en.rootBounds && en.rootBounds.height) || window.innerHeight;
        const seen = en.isIntersecting && (en.intersectionRatio >= 0.5 || en.intersectionRect.height >= viewH * 0.5);
        if (seen) {
          if (!timers[id]) timers[id] = setTimeout(function () { queueRead(id); }, READ_DELAY_MS);
        } else {
          clearTimeout(timers[id]);
          delete timers[id];
        }
      });
    }, { threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] });
    document.querySelectorAll('.thread[data-unread]').forEach(function (el) { observer.observe(el); });
  }
  function queueRead(id) {
    readQueue[id] = true;
    clearTimeout(readTimer);
    readTimer = setTimeout(function () {
      const ids = Object.keys(readQueue);
      readQueue = {};
      if (!ids.length) return;
      call('api_markRead', token, asId, ids).then(function (r) {
        state.home.threads.forEach(function (t) { if (ids.indexOf(t.id) >= 0 && r.readAt > t.myRead) t.myRead = r.readAt; });
        renderSoon();
      }).catch(function () {});
    }, 800);
  }

  // ===== 操作 =====
  function go(view) {
    state.view = view;
    state.tab = 'threads';
    state.composing = false;
    state.absence = false;
    if (view === 'admin') { state.admin = null; state.notify = null; state.previewIdx = null; } // 管理画面は開くたびに読み直す
    takeSnap();
    document.getElementById('side').classList.remove('open');
    renderAll();
  }
  function toggleSide() { document.getElementById('side').classList.toggle('open'); }
  function toggleAll() { state.showAll = !state.showAll; state.openFolds = {}; renderThreads(); watchUnread(); }
  function setFold(id, v) { state.openFolds[id] = v; renderThreads(); watchUnread(); }
  function togglePop(id, ev) { ev.stopPropagation(); state.pop = state.pop === id ? null : id; renderThreads(); }
  document.addEventListener('click', function (e) {
    if (state.pop && !e.target.closest('.pop, .readers')) { state.pop = null; renderThreads(); }
  });
  function grow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 240) + 'px'; }

  function openComposer() {
    state.composing = !state.composing;
    renderThreads();
    if (state.composing) { const el = document.getElementById('newText'); if (el) el.focus(); }
  }
  // ===== ファイルの添付：選んだらすぐにアップロードし、投稿するときにまとめて付ける =====
  function thumbFail(img) {
    const a = img.parentNode;
    a.className = 'file';
    a.innerHTML = '🖼️ <span>' + esc(a.title) + '</span>';
  }
  function chipsHtml(key) {
    const list = state.attach[key] || [];
    if (!list.length) return '';
    const done = list.every(function (f) { return !f.uploading; });
    return '<div class="chips">' + list.map(function (f, i) {
      return '<span class="chip ' + (f.uploading ? 'up' : '') + '">' + fileIcon(f.mime) + ' ' + esc(f.name) +
        (f.uploading ? '（アップロード中…）' : '<button title="外す" onclick="removeAttach(\'' + key + '\', ' + i + ')">×</button>') + '</span>';
    }).join('') + '<span class="note" style="margin:0;align-self:center">' +
      (done ? '← まだ投稿されていません。「' + (key === '_new' ? '投稿する' : '送信') + '」を押すと、このファイル付きで投稿されます' : 'アップロードが終わるまで待ってください') +
      '</span></div>';
  }
  function channelForKey(key) {
    if (key === '_new') return document.getElementById('newCh').value;
    const t = state.home.threads.filter(function (x) { return x.id === key; })[0];
    return t ? t.channelId : '';
  }
  function pickFiles(key) {
    const input = document.getElementById('filePicker');
    input.value = '';
    input.onchange = function () { Array.prototype.forEach.call(input.files, function (f) { uploadFile(key, f); }); };
    input.click();
  }
  function uploadFile(key, file) {
    if (file.size > MAX_FILE_BYTES) { toast('「' + file.name + '」は大きすぎます（1つ20MBまで）'); return; }
    const chId = channelForKey(key);
    if (key === '_new') state.attach._newCh = chId;
    const list = state.attach[key] = state.attach[key] || [];
    const item = { name: file.name, mime: file.type, uploading: true };
    list.push(item);
    renderAttach(key);
    const reader = new FileReader();
    reader.onload = function () {
      const base64 = String(reader.result).split(',')[1] || '';
      call('api_upload', token, asId, chId, file.name, file.type, base64).then(function (r) {
        Object.assign(item, r, { uploading: false });
        renderAttach(key);
      }).catch(function (e) {
        list.splice(list.indexOf(item), 1);
        renderAttach(key);
        toast('アップロードできませんでした：' + (e.message || e));
      });
    };
    reader.readAsDataURL(file);
  }
  function renderAttach(key) {
    // 入力中の文字を消さないよう、添付の表示のところだけを描き直す
    const box = key === '_new' ? document.querySelector('.composer') : document.querySelector('.thread[data-tid="' + key + '"]');
    if (!box) return;
    const old = box.querySelector('.chips');
    const html = chipsHtml(key);
    if (old) old.outerHTML = html || '<span></span>';
    else if (html) {
      const anchor = key === '_new' ? box.querySelector('textarea') : box.querySelector('.replybox');
      anchor.insertAdjacentHTML(key === '_new' ? 'afterend' : 'beforebegin', html);
    }
  }
  function removeAttach(key, i) {
    const list = state.attach[key] || [];
    const f = list.splice(i, 1)[0];
    renderAttach(key);
    // 投稿しなかったファイルは、「チャット添付」フォルダに残らないようにゴミ箱へ移す
    if (f && f.id) call('api_discardUpload', token, asId, channelForKey(key), f.id).catch(function () {});
  }
  function changeNewCh(v) {
    state.drafts._ch = v;
    if ((state.attach._new || []).length) {
      const oldCh = state.attach._newCh;
      state.attach._new.forEach(function (f) { if (f.id && oldCh) call('api_discardUpload', token, asId, oldCh, f.id).catch(function () {}); });
      state.attach._new = [];
      renderAttach('_new');
      toast('チャンネルを変えたので、添付したファイルを外しました。もう一度添付してください');
    }
  }
  function readyFiles(key) {
    const list = state.attach[key] || [];
    if (list.some(function (f) { return f.uploading; })) { toast('ファイルのアップロードが終わるまで待ってください'); return null; }
    return list.map(function (f) { return { id: f.id, name: f.name, mime: f.mime }; });
  }

  // ===== 投稿と返信：押した瞬間に「送信中…」で表示し、記録は裏で行う =====
  function localNow() {
    const d = new Date(), p = function (n, w) { return String(n).padStart(w || 2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p(d.getMilliseconds(), 3);
  }
  function tempPost(text, files) {
    const me = state.res.who.member;
    const rx = {}; ['see', 'like', 'no'].forEach(function (k) { rx[k] = { n: 0, mine: false, names: [] }; });
    return {
      id: 'tmp_' + Date.now() + Math.random().toString(36).slice(2, 6), pending: true, createdAt: localNow(), body: text, mine: true,
      author: { id: me.id, name: me.name, role: me.role },
      files: files.map(function (f) { return { id: f.id, name: f.name, mime: f.mime, url: 'https://drive.google.com/file/d/' + f.id + '/view' }; }),
      reactions: rx, readers: { n: 0, names: me.role === '保護者' ? null : [], me: false }, abs: null
    };
  }
  /** 裏で記録する（記録の途中は、新着の確認で古いデータに戻らないように休む） */
  function sendInBackground(fn, args, onOk, onFail) {
    state.pendingOps = (state.pendingOps || 0) + 1;
    return call.apply(null, [fn, token, asId].concat(args)).then(onOk).catch(function (e) {
      onFail();
      toast('送れませんでした：' + (e.message || e) + '（書いた文は元に戻しました）');
    }).finally(function () { state.pendingOps--; renderSoon(); });
  }
  function newThread() {
    const text = (document.getElementById('newText').value || '').trim();
    const chId = document.getElementById('newCh').value;
    const files = readyFiles('_new');
    if (!files) return;
    if (!text && !files.length) { toast('本文を入力するか、ファイルを添付してください'); return; }
    const p = tempPost(text, files);
    const t = { id: 'tmp_t' + Date.now(), channelId: chId, pinned: false, myPin: false, updatedAt: p.createdAt, myRead: p.createdAt, posts: [p], pending: true };
    const saved = { text: state.drafts._new, attach: state.attach._new };
    state.home.threads.push(t);
    state.drafts._new = ''; state.attach._new = []; state.composing = false;
    renderAll();
    sendInBackground('api_newThread', [chId, text, files], function (r) {
      t.id = r.threadId; t.pending = false; t.updatedAt = r.createdAt; t.myRead = r.createdAt;
      p.id = r.postId; p.pending = false; p.createdAt = r.createdAt; p.files = r.files;
    }, function () {
      state.home.threads.splice(state.home.threads.indexOf(t), 1);
      state.drafts._new = saved.text; state.attach._new = saved.attach; state.composing = true;
      renderAll();
    });
  }
  function reply(tid) {
    const el = document.getElementById('rb-' + tid);
    const text = (el.value || '').trim();
    const files = readyFiles(tid);
    if (!files) return;
    if (!text && !files.length) return;
    const t = state.home.threads.filter(function (x) { return x.id === tid; })[0];
    if (!t) return;
    const p = tempPost(text, files);
    const saved = { text: state.drafts[tid], attach: state.attach[tid], updatedAt: t.updatedAt };
    t.posts.push(p);
    t.updatedAt = p.createdAt;
    state.drafts[tid] = ''; state.attach[tid] = [];
    state.openFolds[tid] = true; // 自分の返信が折りたたまれて見えなくならないように、このスレッドは開いておく
    el.value = ''; el.blur();
    renderAll();
    sendInBackground('api_reply', [tid, text, files], function (r) {
      p.id = r.postId; p.pending = false; p.createdAt = r.createdAt; p.files = r.files;
      t.updatedAt = r.createdAt; if (r.createdAt > t.myRead) t.myRead = r.createdAt;
    }, function () {
      t.posts.splice(t.posts.indexOf(p), 1);
      t.updatedAt = saved.updatedAt;
      state.drafts[tid] = saved.text; state.attach[tid] = saved.attach;
      renderAll();
    });
  }
  // ===== 反応と自分のピン：押した瞬間に画面を変え、記録は裏で行う =====
  // 同じ反応への記録は1つずつ順番に送る（すばやく何度押しても、最後の状態が記録される）。
  // 記録の途中は、新着の確認で古いデータに戻らないように、新着の確認を休む。
  const chains = {};
  function saveInBackground(key, fn, args, undo) {
    state.pendingOps = (state.pendingOps || 0) + 1;
    chains[key] = (chains[key] || Promise.resolve()).then(function () {
      return call.apply(null, [fn, token, asId].concat(args));
    }).catch(function (e) {
      undo();
      renderThreads();
      toast('記録できませんでした：' + (e.message || e));
    }).finally(function () {
      state.pendingOps--;
    });
  }
  function findPost(pid) {
    for (const t of state.home.threads) for (const p of t.posts) if (p.id === pid) return p;
    return null;
  }
  function react(pid, kind) {
    const p = findPost(pid);
    if (!p) return;
    const r = p.reactions[kind], myName = state.res.who.member.name;

  function absencesHtml(a) {
    let h = '<p class="note">欠席連絡のチャンネルで送られた連絡を、日付の順にまとめています（2週間前から）。生徒本人からの分と、保護者からの分の両方です。</p>';
    h += '<table class="ftable"><tr><th>日付</th><th>生徒</th><th>種類</th><th>送った人</th><th>🔒 先生・指導者へのメモ</th></tr>';
    h += a.absences.map(function (x) {
      return '<tr style="' + (x.isPast ? 'color:var(--sub)' : '') + '"><td>' + mdw(x.date) + '</td><td>' + esc(x.student) + '</td><td>' + esc(x.kind) + '</td><td>' + esc(x.from) + '（' + esc(x.fromRole) + '）</td>' +
        '<td style="white-space:pre-wrap">' + esc(x.note) + '</td></tr>';
    }).join('') || '<tr><td colspan="5">まだありません</td></tr>';
    return h + '</table>';
  }

  // ----- 欠席連絡 -----
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  function mdw(d) { const x = new Date(d + 'T00:00:00'); return (x.getMonth() + 1) + '/' + x.getDate() + '（' + WD[x.getDay()] + '）'; }
  function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  // 入力中の欠席連絡（新着の確認で画面を描き直しても消えないように、ここに覚えておく）
  state.absDraft = null;
  function openAbsence() {
    state.absence = !state.absence; state.composing = false;
    state.absDraft = { who: '', date: todayStr(), kind: '欠席', note: '' };
    renderThreads();
  }
  function absInput(k, v) { if (state.absDraft) state.absDraft[k] = v; }
  function absenceFormHtml(ch) {
    const me = state.res.who.member;
    const d = state.absDraft || { who: '', date: todayStr(), kind: '欠席', note: '' };
    const opt = function (id, label) { return '<option value="' + id + '"' + (d.who === id ? ' selected' : '') + '>' + label + '</option>'; };
    const onWho = ' onchange="absInput(\'who\', this.value)"';
    let who;
    if (me.role === '保護者') {
      const kids = me.childrenInfo || [];
      who = kids.length ? '<select id="absWho"' + onWho + '>' + kids.map(function (k) { return opt(k.id, esc(k.name)); }).join('') + '</select>'
        : '<span class="ng">お子さんが登録されていません。管理者の先生に伝えてください。</span>';
    } else if (me.role === '生徒') {
      who = '<b>' + esc(me.name) + '</b>';
    } else {
      // 先生が代わりに登録する
      const st = state.res.students || [];
      who = '<select id="absWho"' + onWho + '>' + opt('', '（生徒を選ぶ）') + st.map(function (s) {
        return opt(s.id, esc(s.name) + (s.grade ? '（' + s.grade + '年）' : ''));
      }).join('') + '</select><span class="note" style="margin:0 0 0 8px">先生が代わりに登録します（「' + esc(me.name) + 'が登録」と表示されます）</span>';
    }
    return '<div class="composer abs"><b>📝 欠席連絡</b>' +
      '<div class="row"><span class="lbl">だれが</span>' + who + '</div>' +
      '<div class="row"><span class="lbl">いつ</span><input type="date" id="absDate" value="' + esc(d.date) + '" onchange="absInput(\'date\', this.value)"></div>' +
      '<div class="row"><span class="lbl">種類</span>' + ['欠席', '遅刻', '早退'].map(function (k) {
        return '<label style="margin-right:12px"><input type="radio" name="absKind" value="' + k + '"' + (d.kind === k ? ' checked' : '') + ' onchange="absInput(\'kind\', this.value)"> ' + k + '</label>';
      }).join('') + '</div>' +
      '<div class="row"><span class="lbl">先生・指導者<br>へのメモ</span><textarea id="absNote" class="abs-memo" maxlength="500" placeholder="（任意）先生と指導者だけに伝えたいこと。理由など" oninput="absInput(\'note\', this.value)">' + esc(d.note) + '</textarea></div>' +
      '<div class="row"><span class="lbl"></span><span class="note" style="margin:0">「だれが・いつ・種類」は、このチャンネルを見られる人全員に見えます。<br>' +
      '🔒 メモは<b>先生と指導者だけ</b>に見えます（ほかの保護者や生徒には見えません）。</span></div>' +
      '<div class="row"><span style="flex:1"></span>' +
      '<button class="btn sub small" onclick="state.absence=false; renderThreads()">やめる</button><button class="btn small" onclick="sendAbsence(\'' + ch.id + '\')">送信</button></div></div>';
  }
  function sendAbsence(chId) {
    const sel = document.getElementById('absWho');
    const date = document.getElementById('absDate').value;
    const kind = document.querySelector('input[name=absKind]:checked').value;
    if (!date) { toast('日付を選んでください'); return; }
    if (state.res.who.member.role !== '生徒' && (!sel || !sel.value)) { toast('生徒を選んでください'); return; }
    const note = (document.getElementById('absNote').value || '').trim();
    act('api_absence', chId, sel ? sel.value : '', date, kind, note).then(function (ok) {
      if (!ok) return;
      state.absence = false; state.absDraft = null;
      toast('欠席連絡を送りました：' + mdw(date) + ' ' + kind);
      renderAll();
    });
  }

  // ----- 検索 -----
  function doSearch(q) {
    q = String(q || '').trim();
    if (!q) return;
    state.view = 'search';
    state.search = { q: q, results: null };
    renderAll();
    call('api_search', token, asId, q).then(function (r) {
      if (!state.search || state.search.q !== q) return;
      state.search.results = r; renderAll();
    }).catch(function (e) { toast('検索できませんでした：' + (e.message || e)); });
  }
  function renderSearch() {
    const s = state.search;
    document.getElementById('title').textContent = '🔍 検索：' + s.q;
    document.getElementById('tabs').innerHTML = '';
    const list = document.getElementById('list');
    if (!s.results) { list.innerHTML = '<p class="note">探しています…</p>'; return; }
    const words = s.q.split(/\s+/).filter(String);
    const mark = function (text) {
      let h = esc(text);
      words.forEach(function (w) { h = h.split(esc(w)).join('<mark>' + esc(w) + '</mark>'); });
      return h;
    };
    let h = '<p class="note">「' + esc(s.q) + '」を含む投稿：' + s.results.length + '件' + (s.results.length >= 100 ? '（新しい100件まで）' : '') + '。押すと、そのスレッドを開きます。</p>';
    h += s.results.map(function (r) {
      const ch = chById(r.channelId);
      return '<div class="thread result" onclick="openResult(\'' + r.channelId + '\', \'' + r.threadId + '\')"><div class="t-top"><span class="chtag"># ' + esc(ch ? ch.name : '') + '</span>' +
        '<span>' + esc(r.author) + '・' + shortTime(r.createdAt) + '</span></div><div class="post"><div class="body">' +
        (r.body ? '<div class="text">' + mark(r.body) + '</div>' : '') +
        (r.files.length ? '<div class="note" style="margin:4px 0 0">📎 ' + r.files.map(mark).join('、') + '</div>' : '') + '</div></div></div>';
    }).join('');
    list.innerHTML = h;
  }
  function openResult(chId, tid) {
    go(chId);
    state.openFolds[tid] = true; // 探した投稿が折りたたまれて見えなくならないように開く
    renderThreads(); watchUnread();
    const el = document.querySelector('.thread[data-tid="' + tid + '"]');
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 2000); }
  }
</script>
</body>
</html>
